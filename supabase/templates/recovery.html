<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#fafafa;font-family:Arial,Helvetica,sans-serif;color:#18181b">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e4e4e7;border-radius:10px">
      <tr>
        <td style="padding:32px">
          <h1 style="margin:0 0 12px;font-size:20px">Redefinição de senha</h1>
          <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#52525b">
            Recebemos um pedido para criar uma nova senha para a sua conta. O link vale por tempo limitado e só pode ser usado uma vez.
          </p>
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/redefinir-senha"
             style="display:inline-block;padding:12px 20px;background:#18181b;color:#ffffff;text-decoration:none;border-radius:8px;font-size:14px;font-weight:bold">
            Criar nova senha
          </a>
          <p style="margin:24px 0 0;font-size:12px;line-height:1.6;color:#71717a">
            Se você não fez esse pedido, ignore este e-mail. Sua senha atual continua válida.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
