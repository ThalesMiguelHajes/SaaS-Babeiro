name: Banco de dados (Supabase)

# Aplica as migrations no projeto Supabase hospedado.
# Requer os segredos do repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – token pessoal (supabase.com → Account → Access Tokens)
#   SUPABASE_DB_PASSWORD   – senha do banco definida ao criar o projeto
#   SUPABASE_PROJECT_REF   – identificador do projeto (Project Settings → General → Reference ID)
# O seed de desenvolvimento NUNCA é aplicado aqui.

on:
  workflow_dispatch:

concurrency:
  group: deploy-db
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Aplicar migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Verificar configuração
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Segredos do Supabase ausentes ou com nome errado (ver DEPLOY.md, Parte B)."
              exit 1
            fi
            echo "::warning::Segredos do Supabase não configurados — migrations não aplicadas (ver DEPLOY.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.check.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Região do projeto (deve ser sa-east-1 = São Paulo)
        if: steps.check.outputs.ready == 'true'
        run: |
          pnpm exec supabase projects list -o json \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).find(x=>x.id===process.env.SUPABASE_PROJECT_REF||x.ref===process.env.SUPABASE_PROJECT_REF);console.log("Região do Supabase:",p?p.region:"não encontrada")})'
      - name: Vincular projeto
        if: steps.check.outputs.ready == 'true'
        run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Aplicar migrations pendentes
        if: steps.check.outputs.ready == 'true'
        # A CLI v3 aplica no banco local por padrão; --remote aponta para o projeto vinculado.
        run: pnpm exec supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --include-all --yes
